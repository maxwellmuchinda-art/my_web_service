<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Festival Line-Up</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f1fb; margin: 0; color: #222; }
    header { background: #5b2a86; color: #fff; padding: 20px; text-align: center; }
    header h1 { margin: 0; font-size: 1.6rem; }
    main { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.15); margin-bottom: 20px; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    label { display: flex; flex-direction: column; font-size: .85rem; font-weight: bold; gap: 4px; }
    input { padding: 8px; border: 1px solid #bbb; border-radius: 4px; font-size: .95rem; }
    .buttons { grid-column: 1 / -1; display: flex; gap: 10px; }
    button { padding: 9px 16px; border: 0; border-radius: 4px; cursor: pointer; font-size: .9rem; color: #fff; }
    .save { background: #5b2a86; }
    .cancel { background: #777; }
    .edit { background: #2b7de9; padding: 5px 10px; }
    .delete { background: #d9363e; padding: 5px 10px; }
    #message { margin-bottom: 10px; font-weight: bold; min-height: 1.2em; }
    .ok { color: #1b7a34; } .err { color: #c0222b; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e3e3e3; font-size: .9rem; white-space: nowrap; }
    th { background: #ece4f6; }
  </style>
</head>
<body>
  <header><h1>Music Festival Line-Up</h1></header>

  <main>
    <div class="card">
      <h2 id="formTitle">Add a performance</h2>
      <div id="message"></div>
      <form id="lineupForm">
        <input type="hidden" id="id" />
        <label>Festival Name *
          <input type="text" id="festival_name" required maxlength="150" />
        </label>
        <label>Artist Name *
          <input type="text" id="artist_name" required maxlength="150" />
        </label>
        <label>Stage
          <input type="text" id="stage" maxlength="80" />
        </label>
        <label>Genre
          <input type="text" id="genre" maxlength="60" />
        </label>
        <label>Date
          <input type="date" id="performance_date" />
        </label>
        <label>Start Time
          <input type="time" id="start_time" />
        </label>
        <div class="buttons">
          <button type="submit" class="save" id="saveBtn">Save</button>
          <button type="button" class="cancel" id="cancelBtn">Cancel Edit</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Line-Up</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Festival</th><th>Artist</th><th>Stage</th>
              <th>Genre</th><th>Date</th><th>Start</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
